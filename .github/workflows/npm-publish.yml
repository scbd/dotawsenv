name: Publish

on:
  release:
    types: [published]

jobs:
  npm-publish:
    # sh-v* releases are for bin/dotawsenv.sh only, not the npm package.
    if: ${{ !startsWith(github.event.release.tag_name, 'sh-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v1
      - uses: actions/setup-node@v1
        with:
          node-version: 12
          registry-url: https://registry.npmjs.org/
      - run: npm install
      - run: npm run-script build
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{secrets.NPM_TOKEN}}