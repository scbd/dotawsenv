name: Shell wrapper

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -s sh bin/dotawsenv.sh test/dotawsenv.test.sh test/stub/aws

  test-dash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: TEST_SH=dash dash test/dotawsenv.test.sh

  test-busybox:
    runs-on: ubuntu-latest
    container: alpine:3
    steps:
      - uses: actions/checkout@v4
      - run: sh test/dotawsenv.test.sh
